apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-platform-app
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-platform-app
  template:
    metadata:
      labels:
        app: devops-platform-app
    spec:
      containers:
        - name: devops-platform-app
          image: localhost/devops-platform-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
